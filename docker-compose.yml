services:
  pmi-agent:
    build: .
    ports:
      - "8000:8000"
    # Optional. With no key the agent still runs end to end — extraction,
    # standardization, conflict detection and file generation are deterministic Python.
    # What you lose is the semantic layer: summaries become templates, and images
    # cannot be interpreted at all. Every fallback is recorded in the data-quality
    # report, so a keyless run is honest about what it could not do.
    env_file:
      - path: .env
        required: false
    volumes:
      # Sessions and generated outputs survive a container restart.
      - ./storage_data:/app/storage_data
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
