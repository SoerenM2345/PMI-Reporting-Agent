[project]
name = "pmi-reporting-agent"
version = "0.2.0"
description = "Agentic AI for automated Post-Merger Integration reporting"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits a real LLM API; requires a key. Deselected by default with -m 'not live'.",
    "corpus: exercises the Dell-EMC v1.0 evaluation corpus (data/corpus/dellemc_vcio). Deselected by default with -m 'not corpus'. The keyless smoke checks in this group need no API key; the full-run tier is additionally marked 'live'.",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]
